[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "healthchatbot-rag-v0"
version = "0.1.0"
description = "Patient-chart RAG using FastAPI and Microsoft Agent Framework"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core==1.13.0",
  "agent-framework-openai==1.12.0",
  "azure-search-documents==12.0.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=2.25,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "tiktoken>=0.11,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.prompts" = ["*.txt", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls configured Azure services"]
